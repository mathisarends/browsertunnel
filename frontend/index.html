<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrowserTunnel</title>
  </head>
  <body>
    <main class="workspace">
      <section class="browser-panel" aria-label="Browser-Vorschau">
        <header class="browser-chrome">
          <div class="tab-strip">
            <div class="window-controls" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="tabs">
              <div id="tab-list" class="tab-list" role="tablist" aria-label="Browser-Tabs"></div>
              <button id="new-tab" class="new-tab" type="button" aria-label="Neuen Tab öffnen">+</button>
            </div>
          </div>
          <div class="browser-bar">
            <nav class="navigation-controls" aria-label="Seitennavigation">
              <button id="nav-back" type="button" aria-label="Zurück" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m12.5 4.5-5.5 5 5.5 5" />
                </svg>
              </button>
              <button id="nav-forward" type="button" aria-label="Vor" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m7.5 4.5 5.5 5-5.5 5" />
                </svg>
              </button>
              <button id="nav-reload" type="button" aria-label="Neu laden" data-loading="false">
                <svg class="reload-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M15.3 7.1A6 6 0 1 0 16 10" />
                  <path d="M15.3 3.8v3.7H12" />
                </svg>
                <svg class="stop-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M6 6h8v8H6z" />
                </svg>
              </button>
            </nav>
            <form id="address-form" class="address-form">
              <label class="visually-hidden" for="address-input">URL</label>
              <input
                id="address-input"
                name="url"
                type="text"
                inputmode="url"
                value="https://example.com"
                placeholder="URL eingeben"
                autocomplete="url"
                spellcheck="false"
              />
            </form>
          </div>
        </header>

        <canvas
          id="browser-canvas"
          width="1600"
          height="900"
          aria-label="Browser-Stream"
        ></canvas>

        <footer class="stream-status">
          <span><i class="status-dot"></i><span id="active-tab-status">Tab 1 · Stream wartet</span></span>
          <span><span id="cursor-status">cursor: default</span> · 1600 × 900</span>
        </footer>
      </section>

      <aside class="log-panel" aria-label="Event-Log">
        <header class="log-header">
          <div>
            <p class="eyebrow">Debug stream</p>
            <h1>Events</h1>
          </div>
          <button id="clear-logs" type="button">Clear</button>
        </header>

        <div class="log-legend" aria-label="Event-Richtungen">
          <span><i class="outgoing-dot"></i>Frontend → Backend</span>
          <span><i class="incoming-dot"></i>Backend → Frontend</span>
        </div>

        <ol id="event-log" class="event-log" aria-live="polite"></ol>
        <p id="empty-log" class="empty-log">Noch keine Events.</p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
