[project]
name = "browsertunnel"
version = "0.1.0"
description = "Mirrors a real Chromium tab into a web page over CDP and JSON-RPC."
requires-python = ">=3.14"
dependencies = [
    "cdpify[websocket]>=0.3.0",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyrpckit>=0.2.0",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browsertunnel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
